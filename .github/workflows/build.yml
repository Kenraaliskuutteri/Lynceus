name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: ./server

      - name: Run tests
        run: pytest
        working-directory: ./server

  build-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper cmake pkg-config libwebsockets-dev fakeroot dpkg-dev

      - name: Build package
        run: dpkg-buildpackage -us -uc -b
        working-directory: ./agent

      - name: Upload Agent Package
        uses: actions/upload-artifact@v4
        with:
          name: lynceus-agent-deb
          path: lynceus-agent_*.deb

  build-app:
    runs-on: ubuntu-latest
    needs: test-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci
        working-directory: ./web

      - name: Build Tauri App
        run: npx tauri build --no-bundle
        working-directory: ./web

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynceus-linux-x86_64
          path: web/src-tauri/target/release/lynceus