name: Build agent .deb

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev cmake pkg-config libwebsockets-dev

      - name: Build package
        working-directory: agent
        run: dpkg-buildpackage -us -uc -b

      - name: Locate deb
        id: locate
        run: echo "deb_path=$(ls *.deb)" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.deb_path }}