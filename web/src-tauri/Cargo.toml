[package]
name = "lynceus"
version = "0.1.0"
description = "Lynceus System Monitor"
edition = "2021"

[lib]
name = "lynceus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
